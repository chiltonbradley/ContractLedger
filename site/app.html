<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contract review · ContractLedger.ai</title><meta name="robots" content="noindex,nofollow"><style>
:root{--ink:#12242c;--muted:#607078;--line:#dce4df;--bg:#f4f7f3;--lime:#c9f36b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,sans-serif}button,input,textarea,select{font:inherit}button,a,input,select,textarea{outline-offset:3px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#32631f}header{background:var(--ink);color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}header a{color:var(--lime);text-decoration:none;font-weight:bold}header small{font-size:13px;color:#c5d2d6}.shell{max-width:1500px;margin:0 auto;padding:24px}.workspace{display:grid;grid-template-columns:240px 1fr;gap:24px}.sidebar{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;height:fit-content}.sidebar button{display:block;width:100%;text-align:left;margin-bottom:10px}.main{min-width:0}h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px}h2{font-size:23px;letter-spacing:-.5px;margin:0 0 15px}h3{font-size:18px;margin:0 0 12px}p{margin:8px 0 20px;color:var(--muted)}label{display:block;font-size:14px;font-weight:bold;margin:14px 0 6px}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #b8c6bd;border-radius:5px;background:white;color:var(--ink);min-width:0}textarea{min-height:95px;resize:vertical}input[type=checkbox]{width:auto;margin-right:8px}.button{background:var(--ink);color:white;border:1px solid var(--ink);border-radius:5px;padding:10px 16px;text-decoration:none;display:inline-block;font-size:14px;font-weight:bold}.button.secondary{background:white;color:var(--ink);border-color:#b7c5bb}.button.lime{background:var(--lime);color:var(--ink);border-color:var(--lime)}.button.danger{background:#973f30;border-color:#973f30}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}.muted{font-size:13px;color:var(--muted)}.notice{background:#e7efdc;border-left:3px solid #88a959;padding:14px 18px;margin-bottom:20px}.error{background:#fff0eb;border-left:3px solid #b3553b;padding:14px 18px;margin-bottom:20px;color:#793627}.pill{display:inline-block;font-size:12px;background:#eaf0e4;padding:4px 9px;border-radius:4px;margin:0 5px 8px 0}.steps{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.steps button{background:white;border:1px solid var(--line);padding:9px 13px;border-radius:5px;font-size:14px}.steps button.active{background:var(--ink);color:white}.review{display:grid;grid-template-columns:minmax(330px,.85fr) minmax(410px,1.15fr);gap:22px;align-items:start}.document{position:sticky;top:16px;background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.document-tools{padding:15px;border-bottom:1px solid var(--line)}.document iframe{border:0;width:100%;height:76vh;background:#e0e5df}.document img{width:100%;max-height:76vh;object-fit:contain}.forms{min-width:0}.charge{border-top:1px solid var(--line);padding:20px 0}.charge:first-child{border-top:0;padding-top:0}.quote{font-size:13px;background:#f2f5ee;padding:12px;margin-top:14px;border-left:2px solid #b4c99d;white-space:pre-wrap}.quote button{border:0;padding:0;color:#356121;background:none;text-decoration:underline;font-size:13px}.horizontal{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f1f5ed}details{margin:12px 0;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:bold;font-size:14px}ul{padding-left:22px}.blockers li{margin:7px 0;font-size:14px}.status{min-height:24px;font-size:14px}.hidden{display:none!important}.page-title{display:flex;justify-content:space-between;align-items:start;gap:15px}.topline{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:#618331;margin-bottom:8px}.narrow{max-width:680px;margin:36px auto}.filebox{border:1px dashed #91a487;padding:20px;background:#f6f9f2;border-radius:7px}.blank{padding:60px 25px;text-align:center}.answer{padding:18px;background:#f1f6e9;border-radius:7px}.company-name{font-weight:bold}.jsontable{min-height:140px;font:13px/1.5 monospace}.hide-empty:empty{display:none}@media(max-width:1100px){.workspace{grid-template-columns:1fr}.sidebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sidebar h3{margin:0}.sidebar select{width:auto;max-width:300px}.sidebar #review-list{display:flex;gap:6px;flex-wrap:wrap}.sidebar button{width:auto;margin:0}.review{grid-template-columns:1fr}.document{position:static}.document iframe{height:55vh}}@media(max-width:600px){.shell{padding:14px}header{padding:16px}.card{padding:18px}.grid2{grid-template-columns:1fr}.page-title{display:block}h1{font-size:26px}.review{display:block}.document{margin-bottom:20px}.steps button{flex:1;padding:8px}.steps{gap:4px}.actions .button{width:100%;text-align:center}}
</style></head><body><header><a href="/">ContractLedger.ai</a><small>Private contract review · Powered by VoltBoost.ai</small></header><div class="shell"><div id="message" class="status" role="status" aria-live="polite"></div><div id="root"><div class="blank">Opening your workspace…</div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let companies=[],company=null,record=null,step=1,activeFile=null,dirty=false,busy=false;
const money=c=>c===null||c===undefined?'Unknown':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(c/100);
function announce(message,error=false){$('#message').className=error?'error':'notice';$('#message').textContent=message;}
async function api(path,options={}){const r=await fetch('/api/review/'+path,{...options,headers:options.body instanceof FormData?{}:{'Content-Type':'application/json',...(options.headers||{})},body:options.body instanceof FormData?options.body:options.body===undefined?undefined:JSON.stringify(options.body)});const data=await r.json();if(!r.ok){if(data.signIn){$('#root').innerHTML='<div class="narrow card"><div class="topline">Your private workspace</div><h1>Sign in to review a contract.</h1><p>Your company folders, original files, and review history stay private to your account.</p><a class="button" href="'+esc(data.signIn)+'" target="_top">Continue with ChatGPT</a></div>';}throw Error(data.error||'Request failed.');}return data;}
async function action(fn){if(busy)return;busy=true;const prior=[...document.querySelectorAll('button')].map(b=>[b,b.disabled]);prior.forEach(([b])=>b.disabled=true);try{await fn();}catch(e){announce(e.message,true);}finally{busy=false;prior.forEach(([b,disabled])=>{if(b.isConnected)b.disabled=disabled;});}}
const button=(text,onclick,secondary=false)=>'<button class="button '+(secondary?'secondary':'')+'" onclick="'+onclick+'">'+text+'</button>';
function input(label,path,value,type='text',extra=''){return '<label>'+esc(label)+'</label><input type="'+type+'" data-path="'+path+'" value="'+esc(value)+'" '+extra+'>';}
function area(label,path,value){return '<label>'+esc(label)+'</label><textarea data-path="'+path+'">'+esc(value)+'</textarea>';}
function select(label,path,value,options){return '<label>'+esc(label)+'</label><select data-path="'+path+'">'+options.map(([v,t])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>';}
function check(label,path,value){return '<label><input type="checkbox" data-path="'+path+'" '+(value?'checked':'')+'>'+esc(label)+'</label>';}
function readFields(){if(!record)return;document.querySelectorAll('[data-path]').forEach(el=>{const parts=el.dataset.path.split('.');let target=record;for(const p of parts.slice(0,-1))target=target[p]??=(/^\d+$/.test(p)?[]:{});const key=parts.at(-1);let v=el.type==='checkbox'?el.checked:el.value;if(['quantity','minimumQuantity','unitPriceDollars','start','end','serviceStart','serviceEnd','deliveryDate','billingCadence'].includes(key)&&v==='')v=null;if(['sspCents','openingDeferredCents','openingAssetCents'].includes(key))v=v===''?null:Number(v);target[key]=v;});if($('#manual-recognition-json')){try{record.review.manualRecognition=JSON.parse($('#manual-recognition-json').value||'[]');}catch{throw Error('Manual recognition must be valid JSON.');}}}
async function boot(){try{const result=await api('bootstrap');companies=result.companies;renderShell();}catch(e){announce(e.message,true);}}
function renderShell(){record=null;$('#root').innerHTML='<div class="workspace"><aside class="sidebar"><h3>Your companies</h3><select id="company-select" aria-label="Company"><option value="">Choose a company</option>'+companies.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select>'+button('New company','newCompany()',true)+'<div id="review-list"></div></aside><main class="main" id="main"><div class="card"><div class="topline">A clearer view of the agreement</div><h1>Read it. Review it. Decide.</h1><p>Select a company or create a private company folder to start. ContractLedger reads the full packet before asking you about missing business facts.</p><p class="muted">Revenue review is intended for contracts with customers. All proposed accounting and journals require human review. Nothing is posted to a ledger.</p></div></main></div>';$('#company-select').onchange=e=>action(()=>chooseCompany(e.target.value));if(companies.length===1){$('#company-select').value=companies[0].id;action(()=>chooseCompany(companies[0].id));}}
function newCompany(){if(dirty&&!confirm('Leave your unsaved review edits?'))return;$('#main').innerHTML='<form class="card narrow" id="company-form"><div class="topline">Company setup</div><h1>A private home for your contracts.</h1><label>Company name</label><input name="name" required maxlength="150"><label>Company save folder</label><input name="folder" required pattern="[-a-zA-Z0-9_]{1,100}" placeholder="company-contracts"><p class="muted">Original packets and period support are stored separately inside this private company folder. No public file links or outside document viewers are used.</p><button class="button">Create company folder</button></form>';$('#company-form').onsubmit=e=>{e.preventDefault();action(async()=>{const f=new FormData(e.target);const created=await api('companies',{method:'POST',body:{name:f.get('name'),folder:f.get('folder')}});companies.push(created);renderShell();$('#company-select').value=created.id;await chooseCompany(created.id);});};}
async function chooseCompany(id){if(!id)return;if(dirty&&!confirm('Leave your unsaved review edits?'))return;company=await api('companies/'+id);record=null;dirty=false;const list=await api('companies/'+id+'/reviews');$('#review-list').innerHTML=list.reviews.map(r=>'<button class="button secondary" onclick="action(()=>openReview(\''+r.id+'\'))">'+esc(r.title)+'<br><small>'+esc(r.status)+'</small></button>').join('');uploadScreen();}
function uploadScreen(supersedesReviewId=null){$('#main').innerHTML='<div class="card"><div class="topline">'+esc(company.name)+' / '+esc(company.folder)+'</div><h1>Bring the whole agreement.</h1><p>Add the signed contract, order forms, and amendments together. We’ll read the full packet and prefill the review.</p><form id="upload-form">'+(supersedesReviewId?'<input type="hidden" name="supersedesReviewId" value="'+esc(supersedesReviewId)+'"><div class="notice">Add the amendment or revised documents. The saved original packet will be included automatically. This pauses future approval of the preceding review.</div>':'')+'<div class="filebox"><label>Original contract packet</label><input type="file" name="files" multiple required accept="application/pdf,image/png,image/jpeg"><p class="muted">Up to six PDF, PNG or JPEG files. 12 MB total. Scanned PDFs are read using the model’s document and vision capabilities.</p></div><label>Your side of the agreement</label><select name="position"><option value="payee">I get paid — contract with my customer</option><option value="payer">I pay — vendor agreement</option></select><label><input type="checkbox" required>I’m authorized to store these files and send them to the configured OpenAI integration for review.</label><button class="button" type="submit">Upload and read the packet</button></form></div>';$('#upload-form').onsubmit=e=>{e.preventDefault();const form=new FormData(e.target);action(async()=>{announce('Saving original files and reading the full packet. Please keep this page open.');const uploaded=await api('companies/'+company.id+'/upload',{method:'POST',body:form});record=await api('reviews/'+uploaded.id);if(!record.terms)record=await api('reviews/'+uploaded.id+'/analyze',{method:'POST',body:{version:record.version}});step=1;activeFile=record.files[0];dirty=false;renderReview();announce(uploaded.reused?'Opened the existing review. The packet was not read again.':'The full packet is read. Review the prefilled terms beside the original.');});};}
async function openReview(id){if(dirty&&!confirm('Leave your unsaved review edits?'))return;record=await api('reviews/'+id);activeFile=record.files[0];step=1;dirty=false;renderReview();}
function quote(e){if(!e)return '';const index=record.files.findIndex(f=>f.name===e.document);return '<div class="quote"><button onclick="showSource('+index+','+(e.page||1)+')">'+esc(e.document)+' · page '+esc(e.page||'?')+'</button> · '+Math.round(e.confidence*100)+'% confidence<br>“'+esc(e.quote)+'”<br><span class="muted">Verify this citation against the original.</span></div>';}
function showSource(index,page){readFields();activeFile=record.files[index]||activeFile;const url='/api/review/reviews/'+record.id+'/file/'+activeFile.hash+'#page='+page;$('#source-frame').src=url;$('#source-choice').value=activeFile.hash;}
function renderReview(){if(!record.terms){$('#main').innerHTML='<div class="card"><h1>Packet saved.</h1><p>The source is saved, but no analysis is available yet.</p>'+button('Read the full packet','action(readAgain)')+'</div>';return;}
  const t=record.terms;$('#main').innerHTML='<div class="page-title"><div><div class="topline">'+esc(company.name)+' · '+esc(record.status)+' · revision '+record.version+'</div><h1>'+esc(t.title||'Contract review')+'</h1><p>'+esc(t.summary)+'</p></div>'+button('Add amendment','uploadScreen(record.id)',true)+button('Another contract','uploadScreen()',true)+'</div><div class="steps">'+['Contract','Charges','Accounting','Schedule & approval'].map((s,i)=>'<button class="'+(step===i+1?'active':'')+'" onclick="goStep('+(i+1)+')">'+(i+1)+'. '+s+'</button>').join('')+'</div><div class="review"><section class="document"><div class="document-tools"><label for="source-choice">Original document</label><select id="source-choice">'+record.files.map(f=>'<option value="'+f.hash+'" '+(activeFile?.hash===f.hash?'selected':'')+'>'+esc(f.name)+'</option>').join('')+'</select><div class="muted">Private source · SHA-256 '+esc((activeFile||record.files[0]).hash.slice(0,16))+'…</div></div><iframe id="source-frame" title="Original contract document" src="/api/review/reviews/'+record.id+'/file/'+(activeFile||record.files[0]).hash+'"></iframe></section><section class="forms" id="step-form">'+stepContent()+'</section></div>';
  $('#source-choice').onchange=e=>{activeFile=record.files.find(f=>f.hash===e.target.value);$('#source-frame').src='/api/review/reviews/'+record.id+'/file/'+activeFile.hash;};
  document.querySelectorAll('[data-path],#manual-recognition-json').forEach(el=>el.onchange=()=>{dirty=true;$('#message').className='notice';$('#message').textContent='You have unsaved review edits. Save to recalculate before approval.';});
}
function goStep(n){readFields();step=n;renderReview();}
function saveButtons(){return '<div class="actions">'+button('Save and recalculate','action(saveReview)')+(step<4?button('Continue review','goStep('+(step+1)+')',true):'')+'</div>';}
function stepContent(){const t=record.terms,r=record.review;let html='';
 if(step===1){html='<div class="card"><h2>Check the agreement.</h2><div class="grid2">'+input('Customer','terms.customer',t.customer)+input('Contract title','terms.title',t.title)+input('Currency','terms.currency',t.currency)+input('Start date','terms.start',t.start,'date')+input('Enforceable end date','terms.end',t.end,'date')+'</div>'+area('Payment terms','terms.paymentTerms',t.paymentTerms)+area('Termination terms','terms.terminationTerms',t.terminationTerms)+area('Renewal terms','terms.renewalTerms',t.renewalTerms)+area('Other material terms','terms.materialTerms',t.materialTerms)+saveButtons()+'</div>';
 const unanswered=t.externalQuestions.filter(q=>!record.answers[q.id]);if(unanswered.length){const q=unanswered[0];html+='<div class="card answer"><h3>One missing business fact</h3><p>'+esc(q.question)+'</p><p class="muted">'+esc(q.reason)+'</p>'+area('Your answer','answers.'+q.id,'')+button('Save answer','action(saveReview)')+'</div>';}
 if(Object.keys(record.answers).length)html+='<details class="card"><summary>Remembered business answers</summary>'+Object.entries(record.answers).map(([k,v])=>'<p>'+esc(t.externalQuestions.find(q=>q.id===k)?.question||k)+'<br><strong>'+esc(v)+'</strong></p>').join('')+'</details>';
 html+='<details class="card"><summary>Read again after material corrections</summary><p>Opening a saved review never triggers another model call. Use this only after new facts or corrections need a fresh analysis.</p>'+button('Reanalyze saved corrections','action(readAgain)',true)+'</details>';
 }
 if(step===2){html='<div class="card"><h2>Every charge, exactly.</h2><p>Unit rates retain all decimal places. Empty quantities mean unknown. A signed minimum is separate from observed users or consumption.</p>'+t.charges.map((c,i)=>'<article class="charge"><h3>'+esc(c.label)+'</h3><div class="grid2">'+input('Charge label','terms.charges.'+i+'.label',c.label)+select('Classification','terms.charges.'+i+'.classification',c.classification,[['fixed','Fixed commitment'],['variable','Variable'],['included','Included / no separate charge'],['non-606','Outside ASC 606']])+input('Exact unit rate (dollars)','terms.charges.'+i+'.unitPriceDollars',c.unitPriceDollars,'text','inputmode="decimal" placeholder="Unknown"')+input('Unit','terms.charges.'+i+'.unit',c.unit)+input('Signed minimum quantity','terms.charges.'+i+'.minimumQuantity',c.minimumQuantity,'text','inputmode="decimal" placeholder="Unknown"')+input('Other established quantity','terms.charges.'+i+'.quantity',c.quantity,'text','inputmode="decimal" placeholder="Unknown"')+select('Billing frequency','terms.charges.'+i+'.billingCadence',c.billingCadence||'',[['','Unresolved'],['one-time','One time'],['monthly','Monthly'],['annual','Annual']])+input('Billing timing','terms.charges.'+i+'.billingTiming',c.billingTiming)+input('Service start','terms.charges.'+i+'.serviceStart',c.serviceStart,'date')+input('Service end','terms.charges.'+i+'.serviceEnd',c.serviceEnd,'date')+'</div>'+quote(c.evidence)+'</article>').join('')+saveButtons()+'</div>';}
 if(step===3){html='<div class="card"><h2>Company policy and accounting review.</h2><p>AI proposals are a starting point for professional judgment. Verify the five-step analysis and applicable exceptions.</p><label>Approved company/product policy and supporting basis</label><textarea id="company-policies">'+esc(record.company.policies||'')+'</textarea><label><input id="company-policy-approved" type="checkbox" '+(record.company.policyApproved?'checked':'')+'>This policy and its contract-specific applicability are approved.</label>'+button('Save company policy','action(savePolicy)',true)+'</div><div class="card"><h2>Performance obligations</h2>'+t.obligations.map((o,i)=>'<article class="charge"><h3>'+esc(o.label)+'</h3>'+area('Proposed judgment','terms.obligations.'+i+'.judgment',o.judgment)+'<div class="grid2">'+input('Supported SSP (integer cents)','terms.obligations.'+i+'.sspCents',o.sspCents,'number')+input('Delivery date','terms.obligations.'+i+'.deliveryDate',o.deliveryDate,'date')+input('Recognition start','terms.obligations.'+i+'.start',o.start,'date')+input('Recognition end','terms.obligations.'+i+'.end',o.end,'date')+'</div>'+quote(o.evidence)+'</article>').join('')+'</div><div class="card"><h2>Assign charges to obligations</h2>'+t.charges.filter(c=>c.classification!=='included').map(c=>{const m=r.recognition[c.id]||{};return '<article class="charge"><h3>'+esc(c.label)+'</h3>'+select('Performance obligation','review.recognition.'+c.id+'.obligationId',m.obligationId||'',[['','Unresolved'],...t.obligations.map(o=>[o.id,o.label])])+select('Reviewed recognition method','review.recognition.'+c.id+'.method',m.method||'unresolved',[['unresolved','Unresolved'],['over-time-daily','Over time — daily'],['point-in-time','Point in time'],['manual','Reviewed manual allocation'],['cohort-monthly','Company-specific new-user cohort policy']])+input('Delivery date when applicable','review.recognition.'+c.id+'.deliveryDate',m.deliveryDate,'date')+(c.classification==='variable'?input('Cohort recognition months (if applicable)','review.recognition.'+c.id+'.recognitionMonths',m.recognitionMonths||'','number')+area('Company-specific cohort policy basis','review.recognition.'+c.id+'.cohortPolicyBasis',m.cohortPolicyBasis||'')+check('This company-specific cohort policy is approved for this charge.','review.recognition.'+c.id+'.cohortPolicyApproved',m.cohortPolicyApproved)+check('Variable consideration constraint and allocation exception have been reviewed.','review.recognition.'+c.id+'.variableAllocationApproved',m.variableAllocationApproved):'')+'</article>';}).join('')+'</div><div class="card"><h2>Accounting findings</h2>'+t.findings.map((f,i)=>'<details><summary>'+esc(f.topic)+' · '+esc(f.status)+'</summary>'+select('Reviewed conclusion status','terms.findings.'+i+'.status',f.status,[['supported','Supported after review'],['unresolved','Unresolved — block approval'],['not-applicable','Not applicable after review']])+area('Conclusion and basis','terms.findings.'+i+'.conclusion',f.conclusion)+'<p class="muted">'+esc(f.guidance)+'</p>'+quote(f.evidence)+'</details>').join('')+'<details><summary>Reviewed manual recognition allocation</summary><p class="muted">For custom fixed-obligation schedules, enter rows with obligationId, month, amountCents and evidenceHash. The amounts must reconcile exactly to the supported allocation.</p><textarea id="manual-recognition-json" class="jsontable">'+esc(JSON.stringify(r.manualRecognition||[],null,2))+'</textarea></details>'+check('I have completed the professional accounting review and retained unresolved judgments as blockers.','review.accountingReviewed',r.accountingReviewed)+'</div><div class="card"><h2>Books and account mapping</h2><div class="grid2">'+['receivable','revenue','deferred','contractAsset'].map(role=>input(role+' GL account','review.accounts.'+role,r.accounts[role]||'')).join('')+input('Opening balance date','review.openingDate',r.openingDate,'date')+input('Opening deferred revenue (cents)','review.openingDeferredCents',r.openingDeferredCents,'number')+input('Opening contract asset (cents)','review.openingAssetCents',r.openingAssetCents,'number')+'</div>'+area('Opening-book source or zero-balance basis','review.openingEvidence',r.openingEvidence)+check('I verified these opening balances, including any actual zero.','review.openingConfirmed',r.openingConfirmed)+input('Performance evidence confirmed through','review.performanceConfirmedThrough',r.performanceConfirmedThrough,'date')+input('Billing completeness confirmed through (YYYY-MM)','review.billingCompleteThrough',r.billingCompleteThrough,'month')+area('Official termination date (only when actually confirmed)','review.officialTerminationDate',r.officialTerminationDate||'')+check('Official termination is confirmed by the linked support file.','review.officialTerminationConfirmed',r.officialTerminationConfirmed)+input('Official termination support hash','review.officialTerminationEvidenceHash',r.officialTerminationEvidenceHash||'')+saveButtons()+'</div>';}
 if(step===4){const s=record.schedule;html='<div class="card"><h2>Evidence for the periods.</h2><p>Add billing and actual-consumption support separately from the contract packet. Actual zero replaces a planning estimate; unknown stays unknown.</p><label>Period-support file</label><input type="file" id="support-file" accept="application/pdf,text/csv,text/plain,image/png,image/jpeg">'+button('Save and read period support','action(uploadSupport)',true)+'<div class="muted">'+record.support.map(f=>esc(f.name)+' · '+esc(f.hash.slice(0,16))+' '+button('Review extracted rows',"action(()=>readSupport('"+f.hash+"'))",true)).join('<br>')+'</div>'+supportProposals()+'<details><summary>Enter actual or planning activity</summary><p class="muted">One line per charge and month. Keep new-license cohorts separate from active seats. Only actual consumed units supported by a file can be recognized.</p><div class="grid2"><div><label>Charge</label><select id="activity-charge">'+t.charges.filter(c=>c.classification==='variable').map(c=>'<option value="'+c.id+'">'+esc(c.label)+'</option>').join('')+'</select></div><div><label>Month</label><input id="activity-month" type="month"></div><div><label>Units (exact decimal)</label><input id="activity-quantity" inputmode="decimal"></div><div><label>Actual cohort start (for new-license fees)</label><input id="activity-cohort-start" type="date"></div><div><label>Actual or plan</label><select id="activity-kind"><option value="actual">Actual consumption</option><option value="plan">Planning estimate</option></select></div><div><label>Supporting file</label><select id="activity-evidence"><option value="">None</option>'+record.support.map(f=>'<option value="'+f.hash+'">'+esc(f.name)+'</option>').join('')+'</select></div></div>'+button('Add activity line','addActivity()',true)+'<div class="muted">'+record.activity.map((a,i)=>esc(a.month+' · '+a.chargeId+' · '+a.quantity+' · '+a.kind)+' <button class="button secondary" onclick="removeActivity('+i+')">Remove line</button>').join('<br>')+'</div></details><details><summary>Enter evidenced billing</summary><div class="grid2"><div><label>Invoice reference</label><input id="billing-reference"></div><div><label>Invoice date</label><input id="billing-date" type="date"></div><div><label>Invoice month</label><input id="billing-month" type="month"></div><div><label>Service period start</label><input id="billing-service-start" type="date"></div><div><label>Service period end</label><input id="billing-service-end" type="date"></div><div><label>Billed amount (integer cents)</label><input id="billing-amount" type="number"></div><div><label>Supporting file</label><select id="billing-evidence"><option value="">None</option>'+record.support.map(f=>'<option value="'+f.hash+'">'+esc(f.name)+'</option>').join('')+'</select></div></div>'+button('Add billing line','addBilling()',true)+'<p class="muted">Billing is separate from cash receipts and remaining accounts receivable.</p><div class="muted">'+record.billing.map((b,i)=>esc(b.month)+' · '+money(b.amountCents)+' <button class="button secondary" onclick="removeBilling('+i+')">Remove line</button>').join('<br>')+'</div></details>'+saveButtons()+'</div><div class="card"><h2>Monthly schedule</h2><span class="pill">Fixed transaction price '+money(s.transactionPriceFixedCents)+'</span><span class="pill">'+esc(s.engineVersion)+'</span><p class="muted">Future periods are a plan until performance is evidenced. Estimated usage is never added to actual usage. Missing billing and opening balances remain unknown.</p><div class="horizontal"><table><thead><tr><th>Month</th><th>Fixed revenue</th><th>Actual variable</th><th>Plan variable</th><th>Total revenue</th><th>Actual billed</th><th>Deferred</th><th>Contract asset</th></tr></thead><tbody>'+s.rows.map(r=>'<tr><td>'+r.month+'</td>'+['fixedCents','actualVariableCents','planningVariableCents','revenueCents','billedCents','deferredCents','contractAssetCents'].map(k=>'<td>'+money(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div><div class="card"><h2>Before financial approval</h2>'+(s.blockers.length?'<ul class="blockers">'+s.blockers.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>':'<div class="notice">The current draft has no outstanding calculation or review blockers.</div>')+'<details><summary>Balanced journal drafts</summary>'+s.journals.map(j=>'<h3>'+j.month+'</h3><table><tr><th>Account</th><th>Debit</th><th>Credit</th></tr>'+j.lines.map(l=>'<tr><td>'+esc(l.account)+'</td><td>'+money(l.debitCents)+'</td><td>'+money(l.creditCents)+'</td></tr>').join('')+'</table>').join('')+'</details><p class="muted">Approval covers these exact drafts and their source, policy, account and schedule hashes. A change invalidates the approval. No ledger posting or recurring posting is enabled.</p><div class="actions"><button class="button" '+(s.blockers.length?'disabled':'')+' onclick="action(approveDraft)">'+(record.approvalValid?'Draft approval verified':'Approve these journal drafts')+'</button><a class="button secondary" href="/api/review/reviews/'+record.id+'/export" target="_blank" rel="noopener">Export draft JSON</a>'+button('Review history','action(showHistory)',true)+'</div></div>';}
 return html;
}
async function saveReview(){readFields();if($('#manual-recognition-json')){try{record.review.manualRecognition=JSON.parse($('#manual-recognition-json').value||'[]');}catch{throw Error('Manual recognition must be valid JSON.');}}record=await api('reviews/'+record.id,{method:'PUT',body:{version:record.version,terms:record.terms,review:record.review,answers:record.answers,activity:record.activity,billing:record.billing}});dirty=false;company=record.company;renderReview();announce('Saved and recalculated. Existing approvals are retained only when the exact reviewed data is unchanged.');}
async function readAgain(){readFields();if(dirty)await saveReview();announce('Re-reading the full packet with your saved corrections and answers.');record=await api('reviews/'+record.id+'/analyze',{method:'POST',body:{version:record.version,reanalyze:!!record.terms,corrections:record.terms}});dirty=false;renderReview();announce('Fresh analysis is ready for verification.');}
async function savePolicy(){const policies=$('#company-policies').value,policyApproved=$('#company-policy-approved').checked;readFields();if(dirty)await saveReview();company=await api('companies/'+company.id,{method:'PUT',body:{version:record.company.version,policies,policyApproved}});record=await api('reviews/'+record.id);renderReview();announce('Company policy saved. Approval hashes now use the new policy version.');}
function supportProposals(){const r=record.supportReview;if(!r)return '';return '<div class="card"><h3>Verify extracted period evidence</h3><p>'+esc(r.sourceName)+' · '+esc(r.customer)+'</p><p class="muted">Choose only verified rows. Each usage row replaces the actual total for its charge and month. A matching invoice reference/date replaces the prior invoice. Plans stay separate. Overlapping selected rows are blocked.</p>'+r.proposals.map(p=>'<article class="charge"><label><input type="checkbox" data-support-id="'+p.id+'" '+(p.issues.length||(record.appliedSupportIds||[]).includes(p.id)?'disabled':'')+'> '+esc(p.kind==='billing'?'Invoice '+p.reference+' · '+p.month+' · '+money(p.totalCents):p.chargeId+' · '+p.metric+' · '+p.month+' · units '+(p.quantity??'unknown')+' · rate '+(p.unitPriceDollars??'unresolved'))+'</label><p>'+esc(p.evidence.quote)+'</p><p class="muted">Page '+esc(p.evidence.page??'unresolved')+' · '+esc(p.evidenceHash.slice(0,16))+'</p>'+p.issues.map(i=>'<p class="blockers">'+esc(i)+'</p>').join('')+((record.appliedSupportIds||[]).includes(p.id)?'<p>Already applied</p>':'')+'</article>').join('')+button('Apply selected verified rows','action(applySupport)',true)+r.questions.map(q=>'<p class="muted">'+esc(q)+'</p>').join('')+'</div>';}
async function readSupport(hash){if(dirty)await saveReview();record=await api('reviews/'+record.id+'/read-support',{method:'POST',body:{version:record.version,sourceHash:hash}});renderReview();announce('Extracted evidence is ready. Verify rows before applying them.');}
async function applySupport(){const ids=Array.from(document.querySelectorAll('[data-support-id]:checked')).map(e=>e.dataset.supportId);if(!ids.length)throw Error('Select verified rows first.');if(dirty)throw Error('Save edits before applying support.');record=await api('reviews/'+record.id+'/apply-support',{method:'POST',body:{version:record.version,ids}});renderReview();announce('Verified evidence applied and recalculated. Financial review is required again.');}
async function uploadSupport(){const f=$('#support-file').files[0];if(!f)throw Error('Choose the period-support file first.');if(dirty)await saveReview();const form=new FormData();form.append('file',f);record=await api('reviews/'+record.id+'/support',{method:'POST',body:form});renderReview();announce('Support saved. Reading evidence for proposed billing and actual usage.');const hash=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());await readSupport(Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join(''));}
function addActivity(){const quantity=$('#activity-quantity').value,month=$('#activity-month').value;if(!/^\d+(\.\d+)?$/.test(quantity)||!month)return announce('Enter a month and exact nonnegative units, including 0 when actual zero.',true);readFields();record.activity.push({chargeId:$('#activity-charge').value,month,quantity,kind:$('#activity-kind').value,cohortStart:$('#activity-cohort-start').value||null,evidenceHash:$('#activity-evidence').value||null});dirty=true;renderReview();announce('Activity line added locally. Save and recalculate to verify it.');}
function addBilling(){const amount=$('#billing-amount').value,month=$('#billing-month').value;if(!/^\d+$/.test(amount)||!month)return announce('Enter a month and a nonnegative integer amount in cents.',true);readFields();record.billing.push({id:crypto.randomUUID(),invoiceReference:$('#billing-reference').value,invoiceDate:$('#billing-date').value||null,serviceStart:$('#billing-service-start').value||null,serviceEnd:$('#billing-service-end').value||null,month,amountCents:Number(amount),evidenceHash:$('#billing-evidence').value||null});dirty=true;renderReview();announce('Billing line added locally. Save and recalculate to verify it.');}
function removeActivity(i){readFields();record.activity.splice(i,1);dirty=true;renderReview();announce('Line removed locally. Save and recalculate to record this correction.');}
function removeBilling(i){readFields();record.billing.splice(i,1);dirty=true;renderReview();announce('Line removed locally. Save and recalculate to record this correction.');}
async function approveDraft(){if(dirty)throw Error('Save and verify changes before financial approval.');if(!confirm('Approve exactly these journal drafts? This does not post them to a ledger.'))return;record=await api('reviews/'+record.id+'/approve',{method:'POST',body:{version:record.version,digest:record.digest}});renderReview();announce('Exact journal drafts approved and saved with your identity and source/policy hashes. Nothing was posted.');}
async function showHistory(){const h=await api('reviews/'+record.id+'/history');announce(h.history.map(e=>'Revision '+e.version+': '+e.action+' · '+e.at).join(' | '));}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});boot();
</script></body></html>
